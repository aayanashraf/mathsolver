<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Formula Library – MathSolveIQ</title>
<meta name="description" content="A searchable math formula sheet: algebra, exponents and logs, trigonometry, calculus, geometry and statistics. Copy any formula or print the sheet.">
<link rel="canonical" href="https://mathsolveiq.vercel.app/formulas.html">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<style>
body{padding-left:0}.doc{max-width:760px;margin:0 auto;padding:24px 16px 60px}.doc h1{font:700 32px/1.2 Georgia,serif;margin:12px 0 6px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.top a{color:var(--acc);text-decoration:none;font-weight:600}
label{display:block;font-weight:600;margin:0 0 4px;font-size:14px}[hidden]{display:none!important}

.fr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}.fr:last-child{border:0}
.fr b{display:block}.fr span{font:600 18px Georgia,serif;color:var(--acc)}.fr button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit;font-size:13px}
@media print{.noprint{display:none!important}body{background:#fff;color:#000}.card{border:0;box-shadow:none;padding:0}.fr span{color:#000}.top{display:none}}
</style></head><body>
<div class="doc">
 <div class="top"><a href="index.html">MathSolveIQ</a><a href="index.html">← Back to the solver</a></div>
 <h1>Math Formula Library</h1>
 <p class="lead">Search any formula, copy it, or print the whole sheet.</p>
 <div class="row noprint"><input id="s" placeholder="Search, e.g. circle, derivative, log" aria-label="Search formulas"><button class="btn ghost fit" id="print" type="button">Print sheet</button></div>
 <p class="hint noprint" id="count"></p>
 <div id="list"></div>
</div>
<script src="js/studydata.js"></script>
<script>
(function () {
  var D = window.MSIQ_STUDY.DECKS, list = document.getElementById("list");
  function draw() {
    var k = document.getElementById("s").value.trim().toLowerCase(), n = 0; list.innerHTML = "";
    Object.keys(D).forEach(function (name) {
      var rows = D[name].filter(function (r) { return !k || (name + " " + r[0] + " " + r[1]).toLowerCase().indexOf(k) > -1; });
      if (!rows.length) return;
      var card = document.createElement("div"); card.className = "card"; var h = document.createElement("b"); h.textContent = name; card.appendChild(h);
      rows.forEach(function (r) {
        n++; var row = document.createElement("div"); row.className = "fr";
        var l = document.createElement("div"), a = document.createElement("b"), v = document.createElement("span");
        a.textContent = r[0]; v.textContent = r[1]; l.appendChild(a); l.appendChild(v);
        var b = document.createElement("button"); b.type = "button"; b.className = "noprint"; b.textContent = "Copy";
        b.onclick = function () { var t = r[0] + ": " + r[1]; if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy"; }, 1200); }).catch(function () {}); };
        row.appendChild(l); row.appendChild(b); card.appendChild(row);
      });
      list.appendChild(card);
    });
    document.getElementById("count").textContent = n ? n + " formula" + (n === 1 ? "" : "s") : "No formula matches that search.";
  }
  document.getElementById("s").oninput = draw;
  document.getElementById("print").onclick = function () { window.print(); };
  draw();
})();
</script>
</body></html>
